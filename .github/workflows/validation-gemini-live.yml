name: Validate Khalam Rapide integration
# `main` est dans la liste depuis le 23 octobre 2026 : Khalam Rapide est la
# connexion par défaut de tout le monde, elle ne peut plus n'être validée que
# sur des branches de chantier. Les chemins bornent la dépense : ce dépôt est
# privé, et chaque exécution est comptée à la minute entamée (voir reveil.yml).
on:
  push:
    paths:
      - app/page.tsx
      - app/globals.css
      - app/gemini-live/**
      - app/api/gemini-live/**
      - app/api/mesure/route.ts
      - app/api/etat/route.ts
      - lib/gemini-live-*.ts
      - lib/khalam-rapide-etat.ts
      - tests/gemini-live.test.mjs
      - tests/khalam-rapide.test.mjs
      - tests/interface-maitre-live-browser.cjs
      - .github/workflows/validation-gemini-live.yml
    branches: [main, integration/gemini-live-20261023, diagnostic/gemini-live-20261023, fix/gemini-live-checks-20261023, diagnostic/gemini-audio-natif-20261023, feat/gemini-live-rapide-20261023, fix/gemini-live-acces-20261023, feat/bia-live-principal-20261023, fix/bia-live-consignes-20261023, fix/bia-interface-maitre-20261023, fix/bia-francais-wolof-20261023, fix/bia-supabase-live-20261023]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/gemini-live.test.mjs tests/khalam-rapide.test.mjs tests/diagnostic-ports-gpu.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/interface-maitre-live-browser.cjs
