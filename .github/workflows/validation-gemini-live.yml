name: Validate Gemini Live integration
on:
  push:
    branches: [integration/gemini-live-20261023, diagnostic/gemini-live-20261023, fix/gemini-live-checks-20261023, diagnostic/gemini-audio-natif-20261023, feat/gemini-live-rapide-20261023, fix/gemini-live-acces-20261023, feat/bia-live-principal-20261023, fix/bia-live-consignes-20261023, fix/bia-interface-maitre-20261023, fix/bia-francais-wolof-20261023, fix/bia-supabase-live-20261023]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/gemini-live.test.mjs tests/diagnostic-ports-gpu.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/interface-maitre-live-browser.cjs
