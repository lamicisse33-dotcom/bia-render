name: Validate isolated streaming baseline
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test tests/stabilite-streaming.test.mjs tests/mesure-reception-audio.test.mjs tests/essai-streaming-isole.test.mjs tests/flux-khalam.test.mjs tests/prise-validee.test.mjs tests/ecoute-longue.test.mjs tests/anticipation-conversation.test.mjs
