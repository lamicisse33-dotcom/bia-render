name: Validate isolated experimental ear
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [lib/oreille-essai-auth.ts, tests/oreille-essai-auth.test.mjs, .github/workflows/validation-oreille-essai.yml]
permissions: {contents: read}
jobs:
  ear-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test tests/oreille-essai-auth.test.mjs
      - run: npm run build
