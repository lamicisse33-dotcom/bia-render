# ── EMPÊCHER BIA DE S'ENDORMIR — ET POURQUOI CE FICHIER N'Y SUFFIT PAS ───────
#
# Lamine, le 13 septembre 2026 à 03:40 : deux écrans « SERVICE WAKING UP »
# à une heure d'intervalle, alors que ce réveil tournait censément depuis
# 00:56. Il ne tournait pas. Voici pourquoi, et ce qui le remplace.
#
# ── CE QUE J'AVAIS ÉCRIT ICI HIER ÉTAIT FAUX ─────────────────────────────────
#
# J'avais écrit : « les minutes GitHub sont gratuites sur un dépôt public ».
# BIA-RENDER N'EST PAS PUBLIC. Vérifié ce matin : la page du dépôt répond 404
# à qui n'est pas connecté, et git réclame un mot de passe pour la lire.
#
# Sur un dépôt privé, le forfait gratuit donne 2 000 minutes d'Actions par
# mois, et chaque exécution est comptée à la minute entamée. Un réveil toutes
# les dix minutes, c'est 4 320 exécutions par mois : plus du double du quota.
# Il aurait été coupé vers le milieu du mois — et il aurait emporté avec lui
# TOUTE autre utilisation d'Actions sur le compte, sans prévenir.
#
# C'est la forme exacte de dépense silencieuse qu'on vient de subir ailleurs.
# Je coupe la répétition automatique.
#
# ── ET DE TOUTE FAÇON, ELLE NE PARTAIT PAS ───────────────────────────────────
#
# Sur un dépôt privé en forfait gratuit, les tâches programmées passent en
# dernier dans la file d'attente de GitHub : elles sont décalées de longues
# minutes, et souvent sautées. GitHub l'écrit lui-même — « best effort ».
# Pour tenir un serveur éveillé à quinze minutes près, « au mieux » ne suffit
# pas. Les deux écrans de cette nuit en sont la preuve.
#
# ── CE QUI RÉVEILLE BIA MAINTENANT ───────────────────────────────────────────
#
# Un service de ping extérieur, ponctuel et gratuit — cron-job.org — qui
# demande https://app.khalam.app/api/etat toutes les cinq minutes. C'est leur
# métier, ils sont à l'heure, et ça ne touche ni le modèle, ni la voix, ni la
# transcription : aucun crédit Anthropic, aucun crédit Soynade.
#
# ── CE QUI RESTE DANS CE FICHIER ─────────────────────────────────────────────
#
# Le bouton, et rien d'autre. Actions → « Réveiller BIA » → « Run workflow »
# la réveille à la main avant une démonstration. Une exécution manuelle de
# temps en temps ne pèse rien sur le quota.

name: Réveiller BIA

on:
  # PAS de « schedule » ici, et c'est volontaire — voir l'explication en tête
  # de fichier. Si un jour bia-render devient public, ou si le compte passe à
  # un forfait payant, on pourra remettre :
  #   schedule:
  #     - cron: "*/10 * * * *"
  # Avant de le faire, vérifier les deux choses : que le dépôt est bien
  # public, et que la tâche part vraiment (Actions → l'historique).
  workflow_dispatch:

concurrency:
  group: reveil-bia
  cancel-in-progress: false

jobs:
  reveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Demander une page à BIA
        run: |
          # --max-time 120 : on ACCEPTE d'attendre le réveil, c'est tout
          #   l'intérêt — abandonner à dix secondes laisserait le serveur
          #   s'éteindre pour de bon.
          # --retry 2 : Render répond parfois 502 pendant qu'il se relève ;
          #   ce n'est pas un échec, c'est le réveil en cours.
          code=$(curl --silent --show-error --location \
                      --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors \
                      --output /dev/null --write-out '%{http_code}' \
                      --user-agent 'reveil-bia (GitHub Actions)' \
                      https://app.khalam.app/api/etat) || code="000"
          echo "BIA a répondu : $code"
          if [ "$code" = "200" ]; then
            echo "✓ le serveur est debout"
          else
            echo "⚠ réponse inattendue ($code) — voir « L'état de BIA » dans l'application"
          fi
