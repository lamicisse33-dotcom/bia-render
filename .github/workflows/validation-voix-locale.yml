name: Compilation et syntaxe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances web
        run: npm ci

      - name: Vérifier Piper natif et navigateur
        run: |
          node tests/piper-locale.test.mjs
          node tests/piper-web.test.mjs

      - name: Vérifier Claude et le dialogue mémorisé
        run: node --test tests/cerveau-anthropic.test.mjs tests/dialogue-devoirs.test.mjs tests/dialogue-rapide.test.mjs tests/audio-memoire.test.mjs

      - name: Compiler Next.js
        run: npm run build

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier la syntaxe Python (labo et voix locale)
        run: |
          python -m py_compile outils/wolof_local_tts.py
          python -m py_compile outils/wolof_local_server.py
          python -m py_compile voix-locale/moteur.py
          python -m py_compile voix-locale/serveur.py
